<!doctype html><meta charset="utf-8"><body data-status="pending"><pre id="results"></pre><script type="module">
import {createUiLoader,DEFAULT_COMPONENT_REGISTRY} from '../js/ui/ui.loader.js';
const assert=(v,m)=>{if(!v)throw Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const until=async fn=>{for(let n=0;n<1800;n++){if(fn())return;await sleep(40)}throw Error('Timeout')};
const workers=new Set(),NativeWorker=window.Worker;
window.Worker=class extends NativeWorker{constructor(...args){super(...args);workers.add(this)}terminate(){workers.delete(this);super.terminate()}};
const report={cycles:[],cancelled:false};
try {
 const privateBytes=await (await fetch('../output/draco-assembled-private.glb')).arrayBuffer();
 const bytes=await (await fetch('../output/glb-draco/cube.glb')).arrayBuffer();
 const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',privateBytes))].map(x=>x.toString(16).padStart(2,'0')).join('');
 assert(hash==='a971be6d84a606e33f78bcb1ce39a4e75e56dabd0529a5dbb22507a8e5814fde','exact authorized private fixture required');
 const loader=createUiLoader(DEFAULT_COMPONENT_REGISTRY,{preferBundles:location.search.includes('bundle')}),create=await loader.get('ui.glb.viewer');
 assert(!performance.getEntriesByType('resource').some(x=>x.name.includes('draco-r187')),'decoder lazy');
 const rejected=create({source:privateBytes});rejected.open();await until(()=>rejected.getState().status==='error');assert(rejected.getState().error.includes('draw calls'),'private scene fails separate render-work guard');assert(workers.size===0,'workload rejected before decode');rejected.destroy();
 const viewer=create({source:bytes});
 for(let cycle=0;cycle<3;cycle++) {
  const start=performance.now();viewer.open();assert(viewer.getState().status==='loading','immediate modal');
  await until(()=>viewer.getState().status!=='loading');assert(viewer.getState().status==='ready',viewer.getState().error);
  const openMs=performance.now()-start;
  assert(workers.size===0,'worker terminated after parse');
  const canvas=viewer.refs.viewport.querySelector('canvas'),gl=canvas.getContext('webgl2'),ext=gl.getExtension('WEBGL_debug_renderer_info');
  report.gpu=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  const pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  const colors=new Set();for(let i=0;i<pixels.length;i+=64)colors.add(`${pixels[i]},${pixels[i+1]},${pixels[i+2]}`);assert(colors.size>3,'scene pixels rendered');
  const camera=JSON.stringify(viewer.getState().view.camera),wireStart=performance.now();viewer.setWireframe(true);gl.finish();const wireMs=performance.now()-wireStart;assert(JSON.stringify(viewer.getState().view.camera)===camera,'wireframe preserves camera');viewer.setWireframe(false);
  const orbit=[];for(let i=0;i<5;i++){const t=performance.now();[...viewer.refs.controls.children].find(b=>b.textContent==='Orbit left').click();gl.finish();orbit.push(performance.now()-t)}
  report.cycles.push({openMs,wireMs,orbitMs:orbit,draws:viewer.getState().view.meshes,colors:colors.size});
  await viewer.close();assert(gl.isContextLost()&&workers.size===0,'context and workers cleaned');
 }
 viewer.open();await until(()=>workers.size>0);await viewer.close();await sleep(100);assert(workers.size===0&&viewer.getState().status==='closed'&&!viewer.refs.viewport.children.length,'abort pending decoder, no late render');report.cancelled=true;
 viewer.destroy();
 for(const fixture of ['count-mismatch','invalid']){const bad=create({source:await (await fetch('../output/glb-draco/'+fixture+'.glb')).arrayBuffer()});bad.open();await until(()=>bad.getState().status!=='loading');assert(bad.getState().status==='error','malformed decode rejected');assert(workers.size===0&&!bad.refs.viewport.children.length,'failure cleanup');bad.destroy();}
 document.body.dataset.status='pass';document.querySelector('#results').textContent=JSON.stringify(report,null,2);
}catch(e){document.body.dataset.status='fail';document.querySelector('#results').textContent=e.stack}
</script>
