<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timeline Regression</title>
  <link rel="stylesheet" href="../css/ui/ui.tokens.css">
  <link rel="stylesheet" href="../css/ui/ui.components.css">
  <link rel="stylesheet" href="../css/ui/ui.timeline.css">
</head>
<body data-status="pending">
  <div id="host"></div>
  <pre id="results">pending</pre>
  <script>
    window.addEventListener("error", (event) => {
      document.body.dataset.status = "failed";
      document.getElementById("results").textContent = event.message || "window error";
    });
    window.addEventListener("unhandledrejection", (event) => {
      document.body.dataset.status = "failed";
      document.getElementById("results").textContent = String(event.reason?.message || event.reason || "unhandled rejection");
    });
  </script>
  <script type="module">
    const bundled = new URLSearchParams(location.search).has("bundled");
    const { uiLoader } = await import("../js/ui/ui.loader.js");
    uiLoader.setPreferBundles(bundled);
    await uiLoader.load("ui.timeline");
    const createTimeline = await uiLoader.get("ui.timeline");

    const host = document.getElementById("host");
    const results = document.getElementById("results");
    const failures = [];
    const calls = [];
    let itemClicks = 0;

    function assert(condition, message) {
      if (!condition) {
        failures.push(message);
      }
    }

    const baseItems = [
      {
        id: "call-1",
        contentKey: "media-a",
        type: "call_session",
        customValue: "initial",
        title: "Call Session",
        timestamp: "2026-04-26T09:00:00+08:00",
      },
      {
        id: "note-1",
        title: "Plain Note",
        timestamp: "2026-04-26T08:00:00+08:00",
      },
    ];

    const timeline = createTimeline(host, baseItems, {
      groupByDate: false,
      onItemClick() {
        itemClicks += 1;
      },
      mountItemContent(slot, item, context) {
        if (item.type !== "call_session") {
          return null;
        }
        calls.push(`mount:${item.id}:${item.contentKey}:${item.customValue}:${context.index}/${context.total}`);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "nested-control";
        button.textContent = `Nested ${item.customValue}`;
        slot.appendChild(button);
        return {
          update(nextItem, nextContext) {
            calls.push(`update:${nextItem.id}:${nextItem.contentKey}:${nextItem.customValue}:${nextContext.index}/${nextContext.total}`);
            button.textContent = `Nested ${nextItem.customValue}`;
          },
          destroy() {
            calls.push(`destroy:${item.id}:${item.contentKey}`);
          },
        };
      },
    });

    const firstSlot = host.querySelector(".ui-timeline-custom-content");
    assert(firstSlot, "custom content slot should render for matching item");
    assert(host.querySelectorAll(".ui-timeline-custom-content").length === 1, "non-matching items should not keep empty custom slots");
    assert(calls.includes("mount:call-1:media-a:initial:0/2"), "mount should receive preserved custom item fields and context");

    host.querySelector(".nested-control").click();
    assert(itemClicks === 0, "clicks inside custom content should not trigger item click");

    host.querySelector(".nested-control").dispatchEvent(new KeyboardEvent("keydown", {
      key: "Enter",
      bubbles: true,
      cancelable: true,
    }));
    assert(itemClicks === 0, "keyboard events inside custom content should not trigger item click");

    timeline.update([
      {
        id: "call-1",
        contentKey: "media-a",
        type: "call_session",
        customValue: "updated",
        title: "Call Session Updated",
        timestamp: "2026-04-26T09:05:00+08:00",
      },
      baseItems[1],
    ]);
    const updatedSlot = host.querySelector(".ui-timeline-custom-content");
    assert(updatedSlot === firstSlot, "same id/contentKey should preserve and reparent existing custom host");
    assert(host.querySelector(".nested-control").textContent === "Nested updated", "same-key update should call custom update");
    assert(calls.includes("update:call-1:media-a:updated:0/2"), "update should receive next item and context");

    timeline.update([
      {
        id: "call-1",
        contentKey: "media-b",
        type: "call_session",
        customValue: "remounted",
        title: "Call Session Remounted",
        timestamp: "2026-04-26T09:10:00+08:00",
      },
      baseItems[1],
    ]);
    const remountedSlot = host.querySelector(".ui-timeline-custom-content");
    assert(remountedSlot && remountedSlot !== firstSlot, "contentKey change should remount custom content");
    assert(calls.includes("destroy:call-1:media-a"), "contentKey change should destroy previous custom content");
    assert(calls.includes("mount:call-1:media-b:remounted:0/2"), "contentKey change should mount replacement content");

    timeline.update([baseItems[1]]);
    assert(!host.querySelector(".ui-timeline-custom-content"), "removing custom item should remove custom host");
    assert(calls.includes("destroy:call-1:media-b"), "removing item should destroy custom content");

    timeline.update([
      {
        id: "call-2",
        contentKey: "media-c",
        type: "call_session",
        customValue: "destroy-check",
        title: "Second Call",
        timestamp: "2026-04-26T09:20:00+08:00",
      },
    ]);
    timeline.destroy();
    assert(calls.includes("destroy:call-2:media-c"), "timeline destroy should destroy active custom content");
    assert(host.childNodes.length === 0, "destroy should clear timeline container");

    const compactHost = document.createElement("div");
    document.body.appendChild(compactHost);
    const compactTimeline = createTimeline(compactHost, baseItems, {
      groupByDate: false,
      density: "compact",
      orientation: "vertical",
    });
    const compactItemStyle = getComputedStyle(compactHost.querySelector(".ui-timeline-item"));
    assert(compactItemStyle.paddingTop === "0px" && compactItemStyle.paddingLeft === "0px", "compact vertical timeline items should keep zero padding for rail alignment");
    assert(compactItemStyle.gap === "0px", "compact vertical timeline items should keep zero gap for rail alignment");
    compactTimeline.destroy();
    compactHost.remove();


    const disclosureHost = document.createElement("div");
    disclosureHost.style.cssText = "width:900px;height:300px";
    document.body.append(disclosureHost);
    const disclosureItems = Array.from({length:150}, (_, i) => ({
      id: `native-${i}`, title: "Operator Maya", subtitle: "Team Alpha",
      description: "Full message body with actionable details.", preview: "One line preview",
      timestamp: new Date(Date.UTC(2026, 2, 9) - i * 3600000).toISOString(),
      actions: [{id:"reply",label:"Reply"}]
    }));
    let selected = 0, actionCalls = 0, notifications = 0, updates = 0;
    const native = createTimeline(disclosureHost, disclosureItems, {
      collapsible:true, groupByDate:true, enableVirtualization:true, virtualThreshold:10,
      defaultCollapsed:true, onItemClick(){selected++}, onActionClick(){actionCalls++},
      onCollapseChange(){notifications++},
      mountItemContent(slot) {
        slot.textContent = "Custom body";
        return {update(){updates++}};
      }
    });
    const nativeRow = () => disclosureHost.querySelector('.ui-timeline-item');
    const header = () => nativeRow().querySelector('.ui-timeline-disclosure');
    assert(header().tagName === "BUTTON" && header().getAttribute("aria-expanded") === "false", "native disclosure is a collapsed accessible button");
    assert(document.getElementById(header().getAttribute("aria-controls"))?.hidden, "header controls its hidden details");
    assert(getComputedStyle(header()).display === "grid", "native header uses grid");
    header().focus(); header().click();
    assert(!native.isCollapsed("native-0") && selected === 0 && notifications === 1, "header toggles without row activation");
    assert(document.activeElement === header(), "toggle restores header focus");
    assert(updates > 0, "toggle updates preserved custom content");
    nativeRow().querySelector('.ui-timeline-actions button').click();
    assert(actionCalls === 1 && !native.isCollapsed("native-0"), "actions remain independent");
    native.collapseAll();
    assert(native.isCollapsed("native-140"), "bulk collapse includes offscreen IDs");
    native.setCollapsed("native-140",false);
    assert(!native.isCollapsed("native-140"), "offscreen state can be changed");
    const jump = await native.scrollToItem("native-140");
    assert(jump.found && disclosureHost.querySelector('[data-item-id="native-140"] .ui-timeline-disclosure')?.getAttribute("aria-expanded") === "true", "offscreen remount reflects native state");
    native.update(disclosureItems);
    assert(!native.isCollapsed("native-140"), "update preserves surviving ID state");
    native.setLinkedRange({startMs:Date.UTC(2026,2,8),endMs:Date.UTC(2026,2,10)});
    native.collapseAll();
    assert(native.isCollapsed("native-140"), "bulk includes filtered IDs");
    native.setLinkedRange(null);
    native.prepend([{...disclosureItems[0],id:"new-native",collapsed:false}]);
    assert(!native.isCollapsed("new-native"), "new item initial state overrides default");
    native.update(disclosureItems.slice(0,2));
    native.append([{...disclosureItems[0],id:"native-140"}]);
    assert(native.isCollapsed("native-140"), "removed ID state is pruned");
    native.collapseAll();
    disclosureHost.style.width = "320px";
    await new Promise(resolve => setTimeout(resolve, 50));
    const senderRect = header().querySelector('.ui-timeline-title').getBoundingClientRect();
    const addressedRect = header().querySelector('.ui-timeline-subtitle').getBoundingClientRect();
    const timeRect = header().querySelector('.ui-timeline-time').getBoundingClientRect();
    assert(addressedRect.top > senderRect.top && Math.abs(timeRect.top - senderRect.top) < 12, "mobile stacks addressed while time remains at top right");
    assert(disclosureHost.scrollWidth <= disclosureHost.clientWidth + 1, "mobile disclosure does not overflow");
    native.update(undefined, {collapsible:false});
    assert(!disclosureHost.querySelector('.ui-timeline-disclosure') && !disclosureHost.querySelector('.ui-timeline-details[hidden]'), "disabling disclosure restores normal content");
    native.destroy(); disclosureHost.remove();

    if (failures.length) {
      document.body.dataset.status = "failed";
      results.textContent = failures.join("\n");
    } else {
      document.body.dataset.status = "pass";
      results.textContent = "PASS";
    }
  </script>
</body>
</html>
