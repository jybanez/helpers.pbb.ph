<!doctype html><html lang="en"><meta charset="utf-8"><title>Alert lifecycle regression</title>
<body><button id="opener">Open</button><script type="module">
import {createUiLoader,DEFAULT_COMPONENT_REGISTRY} from '../js/ui/ui.loader.js';
const loader=createUiLoader(DEFAULT_COMPONENT_REGISTRY,{preferBundles:new URLSearchParams(location.search).has('bundle')});
window.alertDialog=await loader.get('ui.dialog.alert');
window.ready=true;
</script></body></html>
