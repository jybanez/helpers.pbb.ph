<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form field alignment</title><style>body{margin:0;background:#080e18;font-family:var(--ui-font,sans-serif)}</style><body><script type="module">
