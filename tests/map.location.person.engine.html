<!doctype html><html lang="en"><meta charset="utf-8"><title>MapLibre 4.6 engine rendering</title>
<body data-status="pending"><iframe title="Real engine fixture" src="../demos/demo.map.location.person.html" style="border:0;width:850px;height:900px"></iframe><pre id="results">pending</pre>
<script type="module">
const frame=document.querySelector('iframe');
if(location.search.includes('bundle'))frame.src='../demos/demo.map.location.person.html?bundle';
const wait=async(check)=>{for(let i=0;i<200;i++){if(check())return;await new Promise(r=>setTimeout(r,50));}throw Error('Engine fixture timeout');};
const assert=(ok,message)=>{if(!ok)throw Error(message);};
try{
 await wait(()=>frame.contentWindow.locationPersonDemo?.person.getState().status==='rendered');
 const {map,person,center}=frame.contentWindow.locationPersonDemo;
 await wait(()=>map.loaded());
 const draw=()=>new Promise(resolve=>{map.once('render',resolve);map.triggerRepaint();});
 const gl=map.getCanvas().getContext('webgl2')||map.getCanvas().getContext('webgl');
 await draw();
 const pixels=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);
 gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 let blue=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i+2]>pixels[i]+30&&pixels[i+2]>pixels[i+1]+15)blue++;
 assert(blue>20,'Real MapLibre person pixels must render');
 let renderMatrix=null;
 map.addLayer({id:'heading-matrix-observer',type:'custom',renderingMode:'3d',render(gl,matrix){renderMatrix=Array.from(matrix);}});
 function goldCenter(){gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let x=0,y=0,count=0;for(let i=0;i<pixels.length;i+=4)if(pixels[i]>170&&pixels[i+1]>70&&pixels[i+1]<210&&pixels[i+2]<90){const index=i/4;x+=index%gl.drawingBufferWidth;y+=Math.floor(index/gl.drawingBufferWidth);count++;}return {x:x/count,y:y/count,count};}
 for(const enabled of [false,true]){
  map.setTerrain(enabled?{source:'dem',exaggeration:2}:null);
  for(const camera of [{bearing:0,pitch:0},{bearing:75,pitch:45},{bearing:155,pitch:60}]){
   map.jumpTo(camera);
   let wrap=null;
   for(const heading of [0,90,180,270,359,0]){
    person.updateHeading(heading);await draw();
    const arrow=goldCenter();assert(arrow.count>3,'real engine visible gold heading arrow');
    const state=person.getState(),anchor=frame.contentWindow.maplibregl.MercatorCoordinate.fromLngLat(state.lngLat,state.terrainOffsetMeters);
    const clip=(x,y,z)=>[0,1,2,3].map(row=>renderMatrix[row]*x+renderMatrix[row+4]*y+renderMatrix[row+8]*z+renderMatrix[row+12]);
    const pixel=p=>[(p[0]/p[3]+1)*gl.drawingBufferWidth/2,(p[1]/p[3]+1)*gl.drawingBufferHeight/2];
    const origin=pixel(clip(anchor.x,anchor.y,anchor.z+.105*state.modelScale)),angle=heading*Math.PI/180;
    const tip=pixel(clip(anchor.x+Math.sin(angle)*.6*state.modelScale,anchor.y-Math.cos(angle)*.6*state.modelScale,anchor.z+.105*state.modelScale));
    assert((arrow.x-origin[0])*(tip[0]-origin[0])+(arrow.y-origin[1])*(tip[1]-origin[1])>1,'real heading matches geographic world ray through terrain/bearing/pitch');
    if(heading===359)wrap=arrow;
    if(heading===0&&wrap)assert(Math.hypot(arrow.x-wrap.x,arrow.y-wrap.y)<3,'359/0 rendered wrap is continuous');
   }
   person.updateHeading(null);await draw();assert(goldCenter().count===0,'real neutral state hides direction');
  }
 }
 map.removeLayer('heading-matrix-observer');
 person.setScaleMode('perspective');map.setTerrain(null);map.jumpTo({pitch:60,bearing:0,zoom:17});await draw();
 function paintedSize(){const data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);let minX=Infinity,minY=Infinity,maxX=-1,maxY=-1;for(let i=0;i<data.length;i+=4)if((data[i+2]>data[i]+30&&data[i+2]>data[i+1]+15)||(data[i]>170&&data[i+1]>70&&data[i+1]<210&&data[i+2]<90)){const index=i/4,x=index%gl.drawingBufferWidth,y=Math.floor(index/gl.drawingBufferWidth);minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);}return maxX<0?0:Math.max((maxX-minX+1)*map.getCanvas().clientWidth/gl.drawingBufferWidth,(maxY-minY+1)*map.getCanvas().clientHeight/gl.drawingBufferHeight);}
 const canvas=map.getCanvas(), width=canvas.clientWidth,height=canvas.clientHeight;
 const nearCoordinate=map.unproject([width/2,height*.8]),farCoordinate=map.unproject([width/2,height*.35]);
 person.updateLngLat(nearCoordinate);await draw();const nearSize=person.getState().projectedSizePx,nearPainted=paintedSize();
 person.updateLngLat(farCoordinate);await draw();const farSize=person.getState().projectedSizePx,farPainted=paintedSize();
 assert(nearSize>farSize+.5,'real tilted camera near/far size ordering');
 assert(nearPainted>farPainted&&farPainted>0,'actual painted model pixels shrink farther from camera');
 map.setTerrain({source:'dem',exaggeration:2});await draw();
 assert(person.getState().projectedSizePx>=8-.01&&person.getState().projectedSizePx<=64+.01&&Number.isFinite(person.getState().terrainOffsetMeters),'perspective terrain/heading remains bounded');
 map.setTerrain(null);await draw();
 for(const zoom of [8,15,20])for(const pitch of [0,60,85]){
  map.jumpTo({zoom,pitch,bearing:65});person.updateLngLat(center);person.updateHeading(90);await draw();
  assert(Math.abs(map.getPitch()-pitch)<.01,'requested high pitch is actually applied');
  const state=person.getState();assert(state.status==='rendered'&&state.projectedSizePx>=8-.01&&state.projectedSizePx<=64+.01,'real high-pitch/zoom projected bounds');
  assert(paintedSize()>0&&paintedSize()<=66,'real high-pitch/zoom painted pixel ceiling');
 }
 person.setScaleMode('screen');person.updateHeading(null);person.updateLngLat(center);
 map.jumpTo({bearing:20,pitch:55,zoom:15});await draw();
 const initialScale=person.getState().modelScale;
 map.jumpTo({bearing:105,pitch:35,zoom:17});await draw();
 assert(person.getState().status==='rendered'&&person.getState().modelScale<initialScale,'perspective/zoom remains rendered and bounded');
 map.setTerrain(null);await draw();assert(person.getState().terrainOffsetMeters===0,'engine terrain off');
 map.setTerrain({source:'dem',exaggeration:2});await draw();
 person.updateLngLat([center[0]+.0015,center[1]+.001]);await draw();
 await wait(()=>Math.abs(person.getState().terrainOffsetMeters)>1);await draw();
 assert(Math.abs(person.getState().terrainOffsetMeters)>1,'real terrain yields a nonzero off-center elevation');
 assert(Math.abs(person.getState().terrainOffsetMeters-map.queryTerrainElevation(person.getState().lngLat))<1e-8,'4.6 terrain offset/exaggeration agree');
 const reloaded=new Promise(resolve=>map.once('style.load',resolve));
 frame.contentDocument.getElementById('reload').click();await reloaded;
 await draw();await wait(()=>person.getState().status==='rendered');
 assert(person.getState().hasResources,'real style reload');
 frame.style.width='375px';map.resize();await draw();assert(person.getState().status==='rendered','narrow width rendering');
 // Settle the terrain-free engine before measuring idle repaint behavior.
 map.setTerrain(null);await draw();
 await new Promise(resolve=>map.once('idle',resolve));
 let count=0;const observed=()=>count++;map.on('render',observed);
 await new Promise(r=>setTimeout(r,500));map.off('render',observed);assert(count<10,'no idle repaint loop');
 person.destroy();assert(!person.getState().hasResources&&!map.getLayer(person.getState().id),'real-engine disposal');
 document.body.dataset.status='pass';document.getElementById('results').textContent=`PASS\nReal MapLibre 4.6 pixels:${blue}; cardinal/wrap heading rays at varied bearing/pitch/terrain, neutral, perspective/zoom, terrain on/off/exaggeration, coordinate update, style reload, mobile-width, idle and dispose passed.`;
}catch(error){document.body.dataset.status='failed';document.getElementById('results').textContent=error.stack+'\n'+frame.contentDocument?.getElementById('state')?.textContent+'\n'+JSON.stringify(frame.contentWindow.locationPersonDemo?.person.getState());}
</script></body></html>
