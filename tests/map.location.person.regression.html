<!doctype html><html lang="en"><meta charset="utf-8"><title>3D location regression</title>
<link rel="stylesheet" href="../css/ui/ui.map.location.person.css">
<body data-status="pending"><canvas id="view" width="600" height="400" style="width:600px;height:400px"></canvas><pre id="results">pending</pre>
<script src="../vendor/maplibre/maplibre-gl.js"></script>
<script type="module">
const source = location.search.includes('bundle')
  ? await import('../dist/helpers.ui.bundle.min.js').then(async ({uiLoader}) => ({createMapLocationPerson: await uiLoader.get('ui.map.location.person')}))
  : await import('../js/ui/ui.map.location.person.js');
const {createMapLocationPerson} = source;
const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', {preserveDrawingBuffer:true});
const errors=[];
function assert(value,message){if(!value) throw Error(message);}
function mockMap() {
  const handlers=new Map(), layers=new Map();
  const map={terrain:0,repaints:0,loaded:true,
    on(n,fn){if(!handlers.has(n))handlers.set(n,new Set());handlers.get(n).add(fn);},
    off(n,fn){handlers.get(n)?.delete(fn);}, emit(n){[...(handlers.get(n)||[])].forEach(fn=>fn());},
    count(){return [...handlers.values()].reduce((s,v)=>s+v.size,0);},
    addLayer(layer){layers.set(layer.id,layer);layer.onAdd(map,gl);},
    removeLayer(id){const layer=layers.get(id);layers.delete(id);layer?.onRemove();},getLayer(id){return layers.get(id);},
    isStyleLoaded(){return map.loaded;}, getCanvas(){return canvas;},getContainer(){return document.body;},
    queryTerrainElevation(){return map.terrain;}, getCenter(){return {lng:0,lat:0};},triggerRepaint(){map.repaints++;},
    draw(matrix){layers.forEach(layer=>layer.render(gl,matrix));},
    reload(){[...layers.keys()].forEach(id=>map.removeLayer(id));map.emit('style.load');},
  };return map;
}
// Known mercator matrix; maps .5/.5 to center, with z rising above the base.
const matrix=[200,0,0,0, 0,-200,0,0, 0,160,0.1,0, -100,100,0,1];
function pixels(){const p=new Uint8Array(600*400*4);gl.readPixels(0,0,600,400,gl.RGBA,gl.UNSIGNED_BYTE,p);return p;}
try {
 assert(gl,'WebGL2 must be available: this is a rendered test, never a source-only pass');
 let map=mockMap(), failures=0;
 const person=createMapLocationPerson({map,maplibre:maplibregl,lngLat:[0,0],onError(){failures++;}});
 assert(person.getState().status==='ready'&&person.getState().hasResources,'resource allocation');
 const repaintCount=map.repaints;gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.BLEND);gl.disable(gl.DEPTH_TEST);const vao=gl.createVertexArray();gl.bindVertexArray(vao);
 map.draw(matrix);
 assert(person.getState().status==='rendered','render success');
 assert(gl.isEnabled(gl.BLEND)&&!gl.isEnabled(gl.DEPTH_TEST)&&gl.getParameter(gl.VERTEX_ARRAY_BINDING)===vao,'shared GL state restored');
 const image=pixels();let blue=0;for(let i=0;i<image.length;i+=4)if(image[i+2]>image[i]+40&&image[i+2]>image[i+1]+20)blue++;
 assert(blue>50,'real blue person pixels rendered');
 assert(document.querySelector('.ui-map-location-person-label').getAttribute('aria-label')==='Current location','accessible current-location name');
 assert(map.repaints===repaintCount,'render has no idle repaint loop');
 function arrowCenter(){const data=pixels();let x=0,y=0,count=0;for(let i=0;i<data.length;i+=4)if(data[i]>170&&data[i+1]>70&&data[i+1]<210&&data[i+2]<90){const index=i/4;x+=index%600;y+=Math.floor(index/600);count++;}return {x:x/count,y:y/count,count};}
 assert(arrowCenter().count===0,'unavailable heading retains original neutral model without arrow');
 for(const bearing of [0,65,150])for(const heading of [0,90,180,270,359,0]){
   const angle=bearing*Math.PI/180,c=Math.cos(angle),s=Math.sin(angle);
   const rotated=[200*c,200*s,0,0, 200*s,-200*c,0,0, 0,160,.1,0, -100*(c+s),100*(c-s),0,1];
   person.updateHeading(heading);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);map.draw(rotated);
   const arrow=arrowCenter();assert(arrow.count>3,'visible directional pixels for cardinal/wrap headings');
   const h=heading*Math.PI/180,dx=Math.sin(h)*c-Math.cos(h)*s,dy=Math.sin(h)*s+Math.cos(h)*c;
   assert((arrow.x-300)*dx+(arrow.y-200)*dy>2,'arrow aligns geographically through bearing rotation');
 }
 person.updateHeading(-1);assert(person.getState().headingDegrees===359,'negative heading normalizes at wrap');
 person.updateHeading(720);assert(person.getState().headingDegrees===0,'multiple turn normalizes');
 const headingRepaints=map.repaints;person.updateHeading(360);assert(map.repaints===headingRepaints,'equivalent headings do not request repaint');
 let invalidHeading=false;try{person.updateHeading(NaN);}catch{invalidHeading=true;}assert(invalidHeading&&person.getState().headingDegrees===0,'invalid heading rejected without clearing valid state');
 assert(document.querySelector('.ui-map-location-person-label').getAttribute('aria-label').includes('device direction 0 degrees'),'accessible direction describes device heading');
 person.updateHeading(null);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);map.draw(matrix);
 assert(!person.getState().directionAvailable&&arrowCenter().count===0,'null hides arrow and restores neutral appearance');
 map.terrain=120;map.draw(matrix);assert(person.getState().terrainOffsetMeters===120,'4.6 exaggerated offset applied once');
 map.terrain=-25;map.draw(matrix);assert(person.getState().terrainOffsetMeters===-25,'negative center-relative terrain offsets preserved');
 map.terrain=null;map.draw(matrix);assert(person.getState().terrainOffsetMeters===0,'terrain off uses zero');
 const oldScale=person.getState().modelScale;const zoomed=matrix.map(v=>v*2);zoomed[15]=1;
 map.draw(zoomed);assert(person.getState().modelScale<oldScale,'apparent size adapts to zoom');
 person.updateLngLat([.01,.02]);map.draw(matrix);assert(person.getState().lngLat[0]===.01,'coordinate updates');
 let rejected=false;try{person.updateLngLat([NaN,90]);}catch{rejected=true;}assert(rejected,'invalid coordinates rejected');
 person.updateLngLat(null);assert(document.querySelector('.ui-map-location-person-label').hidden,'no stale location semantics');
 person.updateLngLat([0,0]);map.reload();map.draw(matrix);assert(person.getState().status==='rendered','style reattachment');
 person.updateHeading(90);map.reload();map.draw(matrix);assert(person.getState().headingDegrees===90&&arrowCenter().count>3,'heading persists across style resources');
 const oldMap=map, oldLayer=oldMap.getLayer(person.getState().id);map=mockMap();person.setMap(map);
 assert(oldMap.count()===0&&!oldMap.getLayer(person.getState().id),'map replacement cleans listeners/layer');
 oldLayer.render(gl,[]);assert(person.getState().status==='ready','stale old-map render ignored');
 map.draw([]);assert(person.getState().status==='error'&&failures===1&&!person.getState().hasResources,'render failure exposes fallback and frees resources');
 person.updateHeading(270);assert(failures===1&&person.getState().status==='error'&&!person.getState().hasResources,'heading change retains failure fallback without repeated error callback');
 person.retry();map.draw(matrix);assert(person.getState().status==='rendered','explicit failure recovery');
 map.emit('webglcontextlost');assert(person.getState().status==='context-lost','context-loss fallback state');
 map.emit('webglcontextrestored');map.draw(matrix);assert(person.getState().status==='rendered','context restore recreates resources');
 person.destroy();person.destroy();assert(map.count()===0&&!person.getState().hasResources&&!document.querySelector('.ui-map-location-person-label'),'terminal dispose removes resources/listeners/semantics');
 assert(!person.updateLngLat([1,1])&&!person.setMap(oldMap)&&!person.updateHeading(90),'destroy terminal');
 const collision=mockMap();collision.addLayer({id:'occupied',onAdd(){},onRemove(){},render(){}});
 const failed=createMapLocationPerson({map:collision,maplibre:maplibregl,lngLat:[0,0],id:'occupied'});
 assert(failed.getState().status==='error','ID collision exposes fallback');failed.destroy();assert(collision.getLayer('occupied'),'foreign layer preserved');
 const pending=mockMap();pending.loaded=false;const waiting=createMapLocationPerson({map:pending,maplibre:maplibregl,lngLat:[0,0]});
 assert(!waiting.getState().hasResources,'wait for loaded style');pending.loaded=true;pending.emit('style.load');waiting.destroy();
 gl.bindVertexArray(null);gl.deleteVertexArray(vao);
 const final=createMapLocationPerson({map:mockMap(),maplibre:maplibregl,lngLat:[0,0]});final.setMap(null);assert(!final.getState().hasResources,'detach map');final.destroy();
 document.body.dataset.status='pass';document.getElementById('results').textContent=`PASS\nRendered blue pixels: ${blue}\nSource/bundle WebGL, terrain offset, update/failure/lifecycle assertions passed.`;
} catch(error){document.body.dataset.status='failed';document.getElementById('results').textContent=error.stack;}
</script></body></html>
