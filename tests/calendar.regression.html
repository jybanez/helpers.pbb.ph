<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar Regression</title>
  <link rel="stylesheet" href="../css/ui/ui.tokens.css">
  <link rel="stylesheet" href="../css/ui/ui.components.css">
  <link rel="stylesheet" href="../css/ui/ui.calendar.css">
  <link rel="stylesheet" href="../css/ui/ui.datepicker.css">
  <style>
    #modalShell {
      width: 340px;
      height: 120px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--ui-border, #2f4e85);
    }

    #modalDatepickerHost {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 8px;
    }
  </style>
</head>
<body data-status="pending">
  <div id="calendarHost"></div>
  <div id="datepickerHost"></div>
  <div id="timeDatepickerHost"></div>
  <div id="rangeTimeDatepickerHost"></div>
  <div id="modalShell" class="ui-modal">
    <div id="modalDatepickerHost"></div>
  </div>
  <pre id="result">Running...</pre>
  <script type="module">
    import { createCalendar } from "../js/ui/ui.calendar.js";
    import { createDatepicker } from "../js/ui/ui.datepicker.js";

    const result = document.getElementById("result");
    const failures = [];
    let selectedPayload = null;
    let viewPayload = null;

    const calendar = createCalendar(document.getElementById("calendarHost"), {
      value: "2026-07-24",
      viewDate: "2026-07-01",
      min: "2026-07-05",
      max: "2026-08-05",
      disabledDates(date) {
        return date.getDay() === 0;
      },
      onSelect(date, state) {
        selectedPayload = { date: date.toISOString(), state };
      },
      onViewChange(date, state) {
        viewPayload = { date: date.toISOString(), state };
      },
    });

    assert(calendar.root?.classList.contains("ui-calendar"), "calendar should expose a root element");
    assert(document.querySelectorAll("#calendarHost .ui-calendar-day").length === 42, "calendar should render a six-week month grid");
    assert(document.querySelector("#calendarHost .ui-calendar-day.is-selected")?.textContent === "24", "calendar should mark the selected date");
    assert(document.querySelector("#calendarHost .ui-calendar-day.is-disabled")?.textContent === "28", "calendar should disable out-of-range days");
    document.querySelector("#calendarHost .ui-calendar-nav[aria-label='Next month']")?.click();
    assert(viewPayload?.state.source === "next", "next navigation should emit view-change source");
    assert(isLocalDate(calendar.getState().viewDate, 2026, 7, 1), "next navigation should update view month");
    const augustFour = Array.from(document.querySelectorAll("#calendarHost .ui-calendar-day")).find((day) => day.textContent === "4" && !day.classList.contains("is-outside"));
    augustFour?.click();
    assert(isLocalDate(selectedPayload?.date, 2026, 7, 4), "calendar should emit selected date");

    const picker = createDatepicker(document.getElementById("datepickerHost"), {
      value: "2026-07-24",
      closeOnSelect: false,
    });
    document.querySelector("#datepickerHost .ui-datepicker-trigger")?.click();
    assert(Boolean(document.querySelector("#datepickerHost .ui-calendar")), "datepicker should compose the shared calendar primitive");
    assert(document.querySelector("#datepickerHost .ui-calendar-day.is-selected")?.textContent === "24", "datepicker calendar should preserve selected state");

    const timePicker = createDatepicker(document.getElementById("timeDatepickerHost"), {
      value: "2026-08-12T12:00:00+08:00",
      showTime: true,
      closeOnSelect: false,
      onChange(value, state) {
        selectedPayload = { value, state };
      },
    });
    document.querySelector("#timeDatepickerHost .ui-datepicker-trigger")?.click();
    const timeInput = document.querySelector("#timeDatepickerHost .ui-datepicker-time input");
    timeInput.value = "13:30";
    timeInput.dispatchEvent(new Event("input", { bubbles: true }));
    assert(selectedPayload?.state?.startTime === "13:30", "single datepicker time input should update state startTime");
    assert(isLocalTime(timePicker.getValue(), 13, 30), "single datepicker time input should update getValue timestamp");
    assert(/1:30|13:30/.test(document.querySelector("#timeDatepickerHost .ui-datepicker-value")?.textContent || ""), "single datepicker trigger text should update after time input");

    const rangeTimePicker = createDatepicker(document.getElementById("rangeTimeDatepickerHost"), {
      value: {
        start: "2026-08-12T09:00:00+08:00",
        end: "2026-08-13T17:00:00+08:00",
      },
      mode: "range",
      showTime: true,
      closeOnSelect: false,
      onChange(value, state) {
        viewPayload = { value, state };
      },
    });
    document.querySelector("#rangeTimeDatepickerHost .ui-datepicker-trigger")?.click();
    const [rangeStartInput, rangeEndInput] = Array.from(document.querySelectorAll("#rangeTimeDatepickerHost .ui-datepicker-time input"));
    rangeStartInput.value = "10:15";
    rangeStartInput.dispatchEvent(new Event("input", { bubbles: true }));
    rangeEndInput.value = "18:45";
    rangeEndInput.dispatchEvent(new Event("input", { bubbles: true }));
    const rangeValue = rangeTimePicker.getValue();
    assert(viewPayload?.state?.startTime === "10:15" && viewPayload?.state?.endTime === "18:45", "range datepicker time inputs should update state times");
    assert(isLocalTime(rangeValue.start, 10, 15), "range datepicker start time input should update start timestamp");
    assert(isLocalTime(rangeValue.end, 18, 45), "range datepicker end time input should update end timestamp");

    const modalPicker = createDatepicker(document.getElementById("modalDatepickerHost"), {
      value: "2026-07-24",
      closeOnSelect: false,
    });
    document.querySelector("#modalDatepickerHost .ui-datepicker-trigger")?.click();
    const portaledPanel = Array.from(document.querySelectorAll(".ui-datepicker-panel.is-portaled")).find((node) => node.parentElement === document.body);
    assert(Boolean(portaledPanel), "datepicker should portal out of modal or overflow ancestors by default");
    assert(getComputedStyle(portaledPanel).position === "fixed", "portaled datepicker panel should use fixed positioning");
    assert(Number.parseInt(getComputedStyle(portaledPanel).zIndex || "0", 10) >= 1600, "portaled datepicker panel should use a modal-safe layer");
    assert(portaledPanel?.getBoundingClientRect().bottom <= window.innerHeight, "portaled datepicker panel should fit inside the viewport");
    document.body.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
    assert(!document.querySelector(".ui-datepicker-panel.is-portaled"), "outside clicks should close a portaled datepicker panel");

    modalPicker.destroy();
    rangeTimePicker.destroy();
    timePicker.destroy();
    picker.destroy();
    calendar.destroy();

    if (failures.length) {
      document.body.dataset.status = "fail";
      result.textContent = `FAIL\n${failures.map((line) => `- ${line}`).join("\n")}`;
    } else {
      document.body.dataset.status = "pass";
      result.textContent = "PASS";
    }

    function assert(condition, message) {
      if (!condition) {
        failures.push(message);
      }
    }

    function isLocalDate(value, year, month, day) {
      const date = new Date(value);
      return date.getFullYear() === year && date.getMonth() === month && date.getDate() === day;
    }

    function isLocalTime(value, hours, minutes) {
      const date = new Date(value);
      return date.getHours() === hours && date.getMinutes() === minutes;
    }
  </script>
</body>
</html>
