<!doctype html><meta charset="utf-8"><body data-status="pending"><button id="opener">Open</button><pre id="results"></pre><script type="module">
import {createUiLoader,DEFAULT_COMPONENT_REGISTRY} from '../js/ui/ui.loader.js';
const assert=(v,m)=>{if(!v)throw Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const until=async fn=>{for(let n=0;n<200;n++){if(fn())return;await sleep(30)}throw Error('Timeout')};
const loader=createUiLoader(DEFAULT_COMPONENT_REGISTRY,{preferBundles:location.search.includes('bundle')});
let copied=0,downloaded=0;
const actions=[{id:'download',onClick:()=>downloaded++},{id:'copy-url',onClick:()=>copied++}];
function check(root,close){const buttons=[...root.querySelectorAll('[data-viewer-action]')];assert(buttons.length===2,'two header actions');assert(buttons.map(b=>b.dataset.viewerAction).join(',')==='copy-url,download','Copy then Download');for(const b of buttons){assert(b.title===b.getAttribute('aria-label')&&b.querySelector('svg'),'accessible icon');const r=b.getBoundingClientRect();assert(r.width>0&&r.left>=0&&r.right<=innerWidth,'narrow header fits');assert(!b.disabled,'available while loading/error');}const last=buttons[1].getBoundingClientRect(),c=close.getBoundingClientRect();assert(last.right<=c.left+1&&Math.abs(last.top-c.top)<24,'actions immediately before Close');return buttons;}
try {
 for(const key of ['ui.glb.viewer','ui.zip.viewer']){
  const create=await loader.get(key);let reject;const viewer=create({headerActions:actions,load:()=>new Promise((r,j)=>reject=j)});viewer.open();await sleep(220);
  let buttons=check(viewer.refs.panel,viewer.refs.closeButton);buttons[0].click();buttons[1].click();await sleep(0);assert(viewer.getState().status==='loading','header actions do not close or end loading');reject(Error('controlled load failure'));await until(()=>viewer.getState().status==='error');check(viewer.refs.panel,viewer.refs.closeButton);
  let received,finish;viewer.update({headerActions:[{id:'download',onClick:({signal})=>{received=signal;return new Promise(r=>finish=r)}}]});viewer.refs.panel.querySelector('[data-viewer-action]').click();await viewer.close();assert(received.aborted,'close aborts handler');finish();viewer.destroy();
 }
 for(const key of ['ui.json.viewer','ui.markdown.viewer','ui.csv.viewer']){
  const create=await loader.get(key),viewer=create({content:key.includes('json')?'{}':key.includes('csv')?'a,b\n1,2':'# Text',sourceUrl:'https://example.test/file',showDownload:false,headerActions:actions});viewer.open();await sleep(220);check(viewer.refs.panel,viewer.refs.closeButton);assert(viewer.refs.download.hidden&&!viewer.refs.external.hidden,'suppress only duplicate download');assert(!viewer.refs.fullscreen.hidden,'fullscreen preserved');viewer.refs.fullscreen.click();assert(viewer.getState().fullscreen,'fullscreen still works');check(viewer.refs.panel,viewer.refs.closeButton);await viewer.close();viewer.destroy();
 }
 const zipCreate=await loader.get('ui.zip.viewer'),parent=zipCreate({source:new ArrayBuffer(0),headerActions:actions});parent.open();await sleep(220);const opener=parent.refs.panel.querySelector('[data-viewer-action]');opener.focus();
 const pdfCreate=await loader.get('ui.pdf.viewer'),pdf=pdfCreate({title:'Long PDF title '.repeat(20),headerActions:actions,url:'about:blank',readyDelayMs:5000});pdf.open();await sleep(50);let buttons=check(pdf.root,pdf.root.querySelector('.ui-pdf-viewer-close'));buttons[0].focus();buttons[0].dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));assert(document.activeElement===buttons[0],'parent does not steal PDF focus');pdf.root.querySelector('iframe').dispatchEvent(new Event('error'));check(pdf.root,pdf.root.querySelector('.ui-pdf-viewer-close'));pdf.close();assert(document.activeElement===opener&&parent.getState().open,'PDF close restores parent');pdf.destroy();
 const host=document.createElement('div');document.body.append(host);const mediaCreate=await loader.get('ui.media.viewer');const media=mediaCreate(host,{items:[{type:'image',src:'./missing-image.png',title:'Image'},{type:'video',src:'./missing-video.mp4',title:'Video'}],headerActions:({item})=>item?.type==='video'?[{id:'download',onClick:()=>downloaded++}]:actions});opener.focus();media.open();await sleep(50);buttons=check(host,host.querySelector('.ui-media-viewer-close'));buttons[0].focus();buttons[0].dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));assert(document.activeElement===buttons[0],'parent does not steal media focus');media.next();assert(host.querySelectorAll('[data-viewer-action]').length===1&&host.querySelector('[data-viewer-action]').dataset.viewerAction==='download','entry without permanent URL exposes Download only');media.close();assert(document.activeElement===opener&&parent.getState().open,'media close restores parent');media.destroy();host.remove();await parent.close();parent.destroy();
 const glbCreate=await loader.get('ui.glb.viewer'),failure=glbCreate({source:new ArrayBuffer(0),headerActions:[{id:'copy-url',onClick:()=>Promise.reject(Error('Clipboard denied'))}]});failure.open();await sleep(220);failure.refs.panel.querySelector('[data-viewer-action]').click();await sleep(0);assert(failure.refs.panel.querySelector('.ui-viewer-header-actions [role=alert]').textContent.includes('Clipboard denied'),'action failure visible');await failure.close();failure.destroy();
 assert(copied===2&&downloaded===2,'host callbacks invoked once');document.body.dataset.status='pass';document.querySelector('#results').textContent='PASS header order, busy/error, host callbacks, narrow layout, download suppression, fullscreen, nested focus, cancellation, image/video context and errors';
}catch(e){document.body.dataset.status='fail';document.querySelector('#results').textContent=e.stack}
</script>
