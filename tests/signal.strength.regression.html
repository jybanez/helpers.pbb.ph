<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Strength Regression Test</title>
  <link rel="stylesheet" href="../css/ui/ui.tokens.css">
  <link rel="stylesheet" href="../css/ui/ui.components.css">
  <link rel="stylesheet" href="../css/ui/ui.signal.strength.css">
  <style>
    body { margin: 0; padding: 16px; background: #0c1017; color: #d7e0f4; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    #results { margin-top: 12px; white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  </style>
</head>
<body data-status="pending">
  <div id="host"></div>
  <pre id="results">Running...</pre>

  <script type="module">
    const { createSignalStrength } = location.search.includes('bundle')
      ? await import('../dist/helpers.ui.bundle.min.js').then(async ({uiLoader}) => ({createSignalStrength:await uiLoader.get('ui.signal.strength')}))
      : await import('../js/ui/ui.signal.strength.js');

    const failures = [];
    const host = document.getElementById("host");
    const results = document.getElementById("results");

    try {
      const signal = createSignalStrength(host, {
        label: "Realtime",
        level: 9,
        tone: "ok",
        text: "84 ms",
        title: "Realtime connected (84 ms)",
        ariaLabel: "Realtime connected, 84 milliseconds",
      });

      let root = host.querySelector(".ui-signal-strength");
      assert(Boolean(root), "signal root should render");
      assert(root.dataset.level === "4", "level should clamp high values to 4");
      assert(root.dataset.tone === "ok", "tone should be reflected in dataset");
      assert(root.classList.contains("ui-signal-strength--ok"), "tone class should render");
      assert(root.getAttribute("role") === "status", "root should expose status role");
      assert(root.getAttribute("aria-label") === "Realtime connected, 84 milliseconds", "explicit aria label should render");
      assert(root.querySelectorAll(".ui-signal-strength-bar.is-active").length === 4, "four active bars should render");

      const textNode = root.querySelector(".ui-signal-strength-text");
      const initialTextWidth = Math.round(textNode.getBoundingClientRect().width);
      signal.update({
        level: 1,
        tone: "warn",
        text: "Reconnect",
        ariaLabel: "Realtime reconnecting",
        ariaLive: "polite",
      });
      root = host.querySelector(".ui-signal-strength");
      assert(root.dataset.level === "1", "update should change level");
      assert(root.dataset.tone === "warn", "update should change tone");
      assert(root.getAttribute("aria-live") === "polite", "ariaLive should update");
      assert(root.querySelector(".ui-signal-strength-text").textContent === "Reconnect", "text should update");
      assert(root.querySelectorAll(".ui-signal-strength-bar.is-active").length === 1, "one active bar should render after update");
      const updatedTextWidth = Math.round(root.querySelector(".ui-signal-strength-text").getBoundingClientRect().width);
      assert(Math.abs(updatedTextWidth - initialTextWidth) <= 2, "text slot width should remain stable across text changes");

      signal.update({ level: -5, tone: "nonsense", text: "Unknown", ariaLabel: "" });
      root = host.querySelector(".ui-signal-strength");
      assert(root.dataset.level === "0", "level should clamp low values to 0");
      assert(root.dataset.tone === "neutral", "invalid tone should normalize to neutral");
      assert(root.getAttribute("aria-label").includes("0 of 4 bars"), "default aria label should include level");

      signal.update({ showText: false, level: 3, tone: "danger", text: "Weak" });
      root = host.querySelector(".ui-signal-strength");
      assert(root.dataset.showText === "false", "bars-only state should be reflected in dataset");
      assert(root.classList.contains("is-bars-only"), "bars-only class should render");
      assert(!root.querySelector(".ui-signal-strength-text"), "bars-only mode should remove visible text node");
      assert(root.querySelectorAll(".ui-signal-strength-bar.is-active").length === 3, "bars-only mode should still render active bars");

      const state = signal.getState();
      assert(state.level === 3 && state.tone === "danger" && state.showText === false, "getState should return normalized options");

      signal.destroy();
      assert(host.children.length === 0, "destroy should clear host");

      const transitions = [];
      const observer = createSignalStrength(host, { level: 4, tone: 'OK', onStateChange(payload) {
        assert(host.firstChild.dataset.level === String(observer.getState().level), 'DOM committed before observer');
        transitions.push(payload);
      }});
      assert(!transitions.length, 'initial render is silent');
      observer.update({level:99,tone:'ok'}); observer.update({metadata:'ignored'});
      assert(!transitions.length,'normalized no-op and unknown metadata are silent');
      observer.update({level:2.4,tone:'WARN',showText:false});
      assert(transitions.length===1 && transitions[0].previous.level===4 && transitions[0].current.level===2 && transitions[0].current.tone==='warn','normalized previous/current transition');
      assert(Object.isFrozen(transitions[0].previous) && Object.isFrozen(transitions[0].current),'snapshots immutable');
      assert(!('onStateChange' in transitions[0].current) && !('metadata' in transitions[0].current),'snapshots contain only supported state');
      const first=transitions[0];
      observer.update({ariaLabel:'Map offline',ariaLive:'polite',label:'Map',title:'Status',text:'Offline',size:'regular',className:'custom'});
      assert(transitions.length===2 && host.firstChild.getAttribute('aria-label')==='Map offline','presentation/accessibility change emits once');
      assert(first.current.text==='' && first.current.showText===false,'old snapshots remain detached');
      observer.update({onStateChange:null}); observer.update({level:1});
      assert(transitions.length===2,'callback removal is silent and disables observations');
      observer.update({onStateChange:payload=>transitions.push(payload)});
      assert(transitions.length===2,'callback replacement only is silent');
      observer.update({tone:'offline'});
      assert(transitions.length===3 && transitions[2].previous.level===1,'replacement sees actual prior state');
      observer.destroy();
      const last=observer.getState(); observer.update({level:4});
      assert(observer.getState().level===last.level && !host.children.length && transitions.length===3,'updates after destroy inert');

      const order=[]; let depth=0,maxDepth=0;
      const nested=createSignalStrength(host,{onStateChange({previous,current}){
        depth++;maxDepth=Math.max(maxDepth,depth);order.push([previous.level,current.level]);
        if(current.level===1){nested.update({level:2});nested.update({level:3});}
        nested.update({level:nested.getState().level});
        depth--;
      }});
      nested.update({level:1});
      assert(JSON.stringify(order)==='[[0,1],[1,2],[2,3]]' && maxDepth===1,'reentrant delivery is FIFO without nested observers');
      nested.destroy();
      const marker=Error('observer failure'); const failuresSeen=[];
      const failing=createSignalStrength(host,{onStateChange({current}){
        failuresSeen.push(current.level);
        if(current.level===1){failing.update({level:2});throw marker;}
      }});
      let caught; try{failing.update({level:1});}catch(error){caught=error;}
      assert(caught===marker && failing.getState().level===2 && host.firstChild.dataset.level==='2' && failuresSeen.join(',')==='1,2','observer error propagates after committed queue drains');
      failing.update({level:3}); assert(failuresSeen.at(-1)===3,'observer delivery recovers after failure');
      failing.destroy();
      let destroyEvents=0;
      const terminal=createSignalStrength(host,{onStateChange(){destroyEvents++;terminal.update({level:2});terminal.destroy();}});
      terminal.update({level:1});
      assert(destroyEvents===1 && !host.children.length,'destroy during callback cancels pending observers');

      finish();
    } catch (error) {
      failures.push(error?.message || String(error));
      finish();
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }

    function finish() {
      const passed = failures.length === 0;
      document.body.dataset.status = passed ? "pass" : "fail";
      results.textContent = `${passed ? "PASS" : "FAIL"}\n${passed ? "Signal strength regression test passed." : failures.join("\n")}`;
    }
  </script>
</body>
</html>
