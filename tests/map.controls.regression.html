<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Controls Regression</title>
  <link rel="stylesheet" href="../css/ui/ui.tokens.css">
  <link rel="stylesheet" href="../css/ui/ui.components.css">
  <link rel="stylesheet" href="../css/ui/ui.map.controls.css">
</head>
<body data-status="pending">
  <div id="host"></div>
  <pre id="results">pending</pre>
  <script>
    window.addEventListener("error", (event) => {
      document.body.dataset.status = "failed";
      document.getElementById("results").textContent = event.message || "window error";
    });
    window.addEventListener("unhandledrejection", (event) => {
      document.body.dataset.status = "failed";
      document.getElementById("results").textContent = String(event.reason?.message || event.reason || "unhandled rejection");
    });
  </script>
  <script type="module">
    const { createMapControls } = new URL(location.href).searchParams.has("bundle")
      ? await import("../dist/helpers.ui.bundle.min.js").then(async ({ uiLoader }) => ({ createMapControls: await uiLoader.get("ui.map.controls") }))
      : await import("../js/ui/ui.map.controls.js");

    const failures = [];
    const results = document.getElementById("results");

    function assert(condition, message) {
      if (!condition) failures.push(message);
    }

    function createMockMap() {
      const handlers = new Map();
      return {
        zoom: 10,
        bearing: 25,
        pitch: 0,
        layerVisibility: {},
        events: [],
        zoomIn() { this.zoom += 1; this.events.push("zoomIn"); },
        zoomOut() { this.zoom -= 1; this.events.push("zoomOut"); },
        easeTo(next) {
          if (Number.isFinite(next.bearing)) this.bearing = next.bearing;
          if (Number.isFinite(next.pitch)) this.pitch = next.pitch;
          this.events.push(["easeTo", { ...next }]);
        },
        getBearing() { return this.bearing; },
        getPitch() { return this.pitch; },
        getLayer(id) { return Boolean(id); },
        setLayoutProperty(id, key, value) {
          this.layerVisibility[id] = { key, value };
        },
        on(name, handler) {
          if (!handlers.has(name)) handlers.set(name, new Set());
          handlers.get(name).add(handler);
        },
        off(name, handler) {
          handlers.get(name)?.delete(handler);
        },
        emit(name) {
          handlers.get(name)?.forEach((handler) => handler());
        },
        handlerCount(name) {
          return handlers.get(name)?.size || 0;
        },
      };
    }

    const layerEvents = [];
    const locateEvents = [];
    const fitEvents = [];
    const map = createMockMap();
    const controls = createMapControls(document.getElementById("host"), {
      map,
      orientation: "horizontal",
      layers: [
        { id: "incidents", label: "Incidents", checked: true },
        { id: "teams", label: "Teams", checked: false },
      ],
      onLocate(payload) { locateEvents.push(payload); },
      onFit(payload) { fitEvents.push(payload); },
      onLayerToggle(payload) { layerEvents.push(payload); },
    });

    document.querySelector('[data-control="zoom-in"]').click();
    document.querySelector('[data-control="zoom-out"]').click();
    document.querySelector('[data-control="compass"]').click();
    document.querySelector('[data-control="pitch-45"]').click();
    document.querySelector('[data-control="locate"]').click();
    document.querySelector('[data-control="fit"]').click();
    document.querySelector('[data-control="layers"]').click();
    const teams = document.querySelector('input[data-layer-id="teams"]');
    teams.checked = true;
    teams.dispatchEvent(new Event("change", { bubbles: true }));

    assert(map.zoom === 10, "zoom controls should call map zoomIn and zoomOut");
    assert(map.bearing === 0, "compass should reset bearing to north");
    assert(map.pitch === 45, "pitch preset should call easeTo with pitch");
    assert(locateEvents.length === 1, "locate callback should fire");
    assert(fitEvents.length === 1, "fit callback should fire");
    assert(layerEvents.length === 1 && layerEvents[0].layerId === "teams" && layerEvents[0].checked === true, "layer toggle callback should fire with layer state");
    assert(map.layerVisibility.teams?.value === "visible", "layer toggle should update MapLibre visibility when layer exists");
    assert(document.querySelector(".ui-map-controls__layers").classList.contains("is-open"), "layer panel should open");
    assert(document.querySelector(".ui-map-controls").classList.contains("ui-map-controls--horizontal"), "orientation should apply horizontal root class");
    assert(document.querySelector('[data-control="pitch-45"]').classList.contains("is-active"), "active pitch button should sync from map");
    assert(map.handlerCount("move") === 1, "map move listener should be bound");

    let activations = 0;
    controls.update({ controls: ["search", "zoom", "compass"], actions: [{
      id: "search", label: "Search map", icon: "actions.search", expanded: false,
      ariaControls: "mobile-search", onActivate({ id, map: supplied, button }) {
        assert(id === "search" && supplied === map && button.tagName === "BUTTON", "custom callback context");
        activations++;
      },
    }] });
    const search = document.querySelector('[data-control="search"]');
    assert(document.querySelector('.ui-map-controls button') === search, "custom action ordered before zoom");
    assert(search.getAttribute('aria-label') === "Search map" && search.title === "Search map", "custom label and tooltip");
    assert(search.querySelector('svg[data-icon="actions.search"]')?.getAttribute('aria-hidden') === "true", "canonical decorative icon");
    assert(search.getAttribute('aria-controls') === "mobile-search", "target association");
    search.focus(); search.click();
    controls.setActionState("search", { expanded: true });
    assert(document.activeElement === search && search.getAttribute('aria-expanded') === "true", "state update preserves focus");
    controls.setActionState("search", { disabled: true });
    search.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    assert(activations === 1 && search.disabled, "disabled action guarded");
    controls.setActionState("search", { visible: false, disabled: false, expanded: null });
    assert(getComputedStyle(search.parentElement).display === "none" && !search.hasAttribute('aria-expanded'), "hidden state and expanded clearing");
    search.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    assert(activations === 1, "hidden action guarded");
    controls.setActionState("search", { visible: true }); search.click();
    assert(activations === 2, "action reenabled");
    controls.update({ actions: [{ id: "search", label: "Find place", onActivate() { activations += 10; } }] });
    search.click();
    assert(activations === 2, "old listener cleaned");
    const replacement = document.querySelector('[data-control="search"]'); replacement.click();
    assert(activations === 12 && replacement.title === "Find place", "callback and label updated");
    assert(map.handlerCount("move") === 1, "no duplicate map listeners");
    document.querySelector('[data-control="zoom-in"]').click();
    assert(map.zoom === 11, "built-in behavior retained");
    let rejected = false;
    try { controls.update({ actions: [{ id: "zoom", label: "Conflict" }] }); } catch { rejected = true; }
    assert(rejected, "reserved ids rejected");
    rejected = false;
    try { controls.update({ actions: [{ id: "search", label: "Search", icon: "invalid.icon" }] }); } catch { rejected = true; }
    assert(rejected && replacement.isConnected, "unknown icon rejected before replacing UI");
    rejected = false;
    try { controls.update({ actions: [{ id: "a", label: "A" }, { id: "a", label: "B" }] }); } catch { rejected = true; }
    assert(rejected, "duplicate action ids rejected");
    controls.destroy(); replacement.click(); controls.update({ controls: ["zoom"] });
    assert(activations === 12 && controls.setActionState("search", { visible: true }) === false, "destroy terminal and listener cleaned");
    assert(map.handlerCount("move") === 0, "map listeners should be removed on destroy");
    assert(!document.querySelector(".ui-map-controls"), "destroy should clear the host");

    if (failures.length) {
      document.body.dataset.status = "failed";
      results.textContent = failures.join("\n");
    } else {
      document.body.dataset.status = "pass";
      results.textContent = "PASS";
    }
  </script>
</body>
</html>
