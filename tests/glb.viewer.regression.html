<!doctype html><meta charset="utf-8"><body data-status="pending"><pre id="results"></pre><script type="module">
import {createUiLoader,DEFAULT_COMPONENT_REGISTRY} from '../js/ui/ui.loader.js';
const assert=(ok,msg)=>{if(!ok)throw Error(msg)},sleep=()=>new Promise(r=>setTimeout(r,40));
const until=async fn=>{for(let i=0;i<150;i++){if(fn())return;await sleep()}throw Error('Timeout: '+document.body.textContent.slice(-500))};
const makeJson=json=>{const text=new TextEncoder().encode(JSON.stringify(json));const n=Math.ceil(text.length/4)*4;const data=new ArrayBuffer(20+n);const v=new DataView(data);[0x46546c67,2,20+n,n,0x4e4f534a].forEach((x,i)=>v.setUint32(i*4,x,true));new Uint8Array(data,20).fill(32);new Uint8Array(data,20,text.length).set(text);return data};
try {
 const loader=createUiLoader(DEFAULT_COMPONENT_REGISTRY,{preferBundles:location.search.includes('bundle')});
 const create=await loader.get('ui.glb.viewer');
 assert(!performance.getEntriesByType('resource').some(x=>x.name.includes('glb.runtime')),'renderer lazy before open');
 const malicious=await (await fetch('./fixtures/oversized-accessor.glb')).arrayBuffer();
 const rejected=create({source:malicious});rejected.open();await until(()=>rejected.getState().status==='error');
 assert(rejected.getState().error.includes('128 MiB'),'tiny oversized accessor rejected by decoded budget');
 assert(!performance.getEntriesByType('resource').some(x=>x.name.includes('glb.runtime')),'malicious geometry rejected before renderer import');await rejected.close();rejected.destroy();
 let resolve,received;
 const viewer=create({load:({signal})=>{received=signal;return new Promise(r=>resolve=r)}});
 viewer.open();assert(viewer.getState().status==='loading'&&viewer.refs.panel.isConnected,'immediate canonical loading modal');
 viewer.open();await viewer.close();assert(received.aborted,'close aborts');
 const data=await (await fetch('./fixtures/textured-room.glb')).arrayBuffer();resolve(data);await sleep();assert(!viewer.refs.viewport.children.length,'stale load ignored');
 viewer.update({source:data});viewer.open();await until(()=>viewer.getState().status!=='loading');assert(viewer.getState().status==='ready',viewer.getState().error);
 const sparse=await (await fetch('./fixtures/sparse-triangle.glb')).arrayBuffer();viewer.update({source:sparse});await until(()=>viewer.getState().status!=='loading');assert(viewer.getState().status==='ready',viewer.getState().error);
 viewer.update({source:data});await until(()=>viewer.getState().status==='ready');
 const canvas=viewer.refs.viewport.querySelector('canvas');assert(canvas&&canvas.width>100&&canvas.height>100,'canvas dimensions');
 const gl=canvas.getContext('webgl2');const pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 const colors=new Set();for(let i=0;i<pixels.length;i+=64)colors.add(`${pixels[i]},${pixels[i+1]},${pixels[i+2]}`);assert(colors.size>20,'textured scene actually rendered');
 await new Promise(r=>setTimeout(r,300));viewer.reset();
 const before=JSON.stringify(viewer.getState().view.camera);canvas.focus();canvas.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));assert(JSON.stringify(viewer.getState().view.camera)!==before,'keyboard orbit');viewer.reset();assert(viewer.getState().view.camera.every((x,i)=>Math.abs(x-JSON.parse(before)[i])<0.00001),'reset view');
 for(const label of ['Pan left','Zoom in','Fit']) [...viewer.refs.controls.children].find(n=>n.textContent===label).click();
 await viewer.close();assert(!viewer.refs.viewport.children.length&&gl.isContextLost(),'close disposes renderer');viewer.open();await until(()=>viewer.getState().status==='ready');
 const invalid=[new ArrayBuffer(8),makeJson({asset:{version:'1.0'}}),makeJson({asset:{version:'2.0'},buffers:[{uri:'https://example.invalid/secret',byteLength:4}]}),makeJson({asset:{version:'2.0'},extensionsRequired:['KHR_draco_mesh_compression']})];
 for(const source of invalid){viewer.update({source});await until(()=>viewer.getState().status==='error');assert(!viewer.refs.retry.hidden&&!viewer.refs.closeButton.disabled,'actionable error and dismissible');}
 assert(!performance.getEntriesByType('resource').some(x=>x.name.includes('example.invalid')),'external reference never fetched');
 let stale;viewer.update({load:()=>new Promise(r=>stale=r),context:'old'});viewer.update({source:data,context:'new'});stale(new ArrayBuffer(1));await until(()=>viewer.getState().status==='ready');assert(!viewer.getState().error,'context stale response ignored');
 window.viewer=viewer;document.body.dataset.status='pass';document.querySelector('#results').textContent='PASS textured scene, keyboard, fit/reset, invalid/external input, abort, dispose, context change and reopen';
}catch(e){document.body.dataset.status='fail';document.querySelector('#results').textContent=e.stack;}
</script>
