<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grouped reorder and inline editors</title>
<style>body{max-width:900px;margin:30px auto;padding:0 18px;font:14px/1.5 Segoe UI,sans-serif;background:var(--ui-bg);color:var(--ui-text)}h1{font-size:24px}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}.fields{display:grid;grid-template-columns:minmax(160px,2fr) minmax(130px,1fr) minmax(160px,1fr);gap:12px}.field-label{display:block;color:var(--ui-muted);font-size:12px}#log{white-space:pre-wrap;padding:12px;border:1px solid var(--ui-border)}@media(max-width:650px){.fields{grid-template-columns:1fr}}</style></head>
<body><h1>Project planning</h1><p>Edit fields in place. Move work using its drag handle, or focus the handle and press Space to begin a keyboard move.</p>
<div class="controls"><label><input id="readonly" type="checkbox"> Read-only</label><label><input id="fail" type="checkbox"> Fail next save</label><label><input id="theme" type="checkbox"> Light theme</label><span id="status" role="status">Local demo · no server requests</span></div><div id="planning"></div><h2>Last change</h2><pre id="log">No changes yet.</pre>
<script type="module">
import { uiLoader } from '../js/ui/ui.loader.js?v=0.21.210';
await uiLoader.loadMany(['ui.reorder.groups','ui.inline.text','ui.inline.select','ui.inline.date']);
const [createGroups,createText,createSelect,createDate]=await Promise.all(['ui.reorder.groups','ui.inline.text','ui.inline.select','ui.inline.date'].map(n=>uiLoader.get(n)));
const data=[{id:'plan',label:'Planning',items:[{id:'scope',label:'Confirm scope',status:'open',date:'2026-10-01'},{id:'design',label:'Review designs',status:'open',date:'2026-10-03'}]},{id:'build',label:'Implementation',items:[{id:'prototype',label:'Build prototype',status:'active',date:null}]},{id:'release',label:'Release',items:[]}];
let records=data, pending=false;
const note=value=>document.querySelector('#log').textContent=JSON.stringify(value,null,2);
async function persist(){await new Promise(r=>setTimeout(r,650));if(document.querySelector('#fail').checked){document.querySelector('#fail').checked=false;throw new Error('Demo save failed. Your draft is preserved; try again.');}}
const groupApi=createGroups(document.querySelector('#planning'),records,{
renderItem(host,item){const grid=document.createElement('div');grid.className='fields';host.append(grid);const editors=[];
for(const [key,label,factory,extra] of [['label','Title',createText,{required:true,maxLength:120}],['status','Status',createSelect,{required:true,items:[{id:'open',label:'Open'},{id:'active',label:'In progress'},{id:'done',label:'Done'}]}],['date','Target date',createDate,{valueMode:'wall-clock',showTime:false}]]){const box=document.createElement('div');const caption=document.createElement('span');caption.className='field-label';caption.textContent=label;const slot=document.createElement('div');box.append(caption,slot);grid.append(box);editors.push(factory(slot,{...extra,label,value:item[key],readOnly:document.querySelector('#readonly').checked,onSave:async value=>{await persist();item[key]=value;records=records.map(g=>({...g,items:g.items.map(i=>i.id===item.id?{...i,[key]:value}:i)}));note({itemId:item.id,field:key,value});}}));}return()=>editors.forEach(e=>e.destroy());},
onReorder:async change=>{if(pending)return;pending=true;const before=records;records=change.groups.map(g=>({...g,items:g.items.map(i=>({...before.flatMap(g=>g.items).find(old=>old.id===i.id)}))}));groupApi.update(records,{disabled:true});document.querySelector('#status').textContent='Saving order…';try{await persist();note({itemId:change.itemId,fromGroupId:change.fromGroupId,toGroupId:change.toGroupId,toIndex:change.toIndex,orderedIdsByGroup:change.orderedIdsByGroup});}catch(e){records=before;note({error:e.message,rolledBack:true});}finally{pending=false;groupApi.update(records,{disabled:false});document.querySelector('#status').textContent='Local demo · no server requests';}}
});
document.querySelector('#readonly').onchange=e=>groupApi.update(records,{readOnly:e.target.checked});
document.querySelector('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.checked?'light':'dark';
</script></body></html>
